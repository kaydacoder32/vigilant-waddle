<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Climb & Mine — Block World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101827;color:#fff;font:14px system-ui,Arial,sans-serif}#game{display:block;width:100vw;height:100vh;cursor:crosshair}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:16px;gap:12px}.card{background:#142238dd;border:1px solid #6b8eb8;border-radius:12px;padding:10px 13px;box-shadow:0 6px 20px #0005}.title{font-size:20px;font-weight:900;color:#61e6a5}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat b{color:#ffd166;margin-left:4px}.help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);text-align:center;line-height:1.55;min-width:310px;color:#dcecff}.help kbd{background:#334b6b;border:1px solid #87a1c4;border-radius:4px;padding:2px 6px;color:#fff;font-weight:800}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 4px #000}.cross:before{width:18px;height:2px;top:8px}.cross:after{width:2px;height:18px;left:8px}.toast{position:absolute;left:50%;top:62%;transform:translateX(-50%);color:#ffd166;font-size:18px;font-weight:800;text-shadow:0 2px 3px #000;opacity:0;transition:.2s}.toast.show{opacity:1}.error{color:#ff8aa5}.hack{display:none;pointer-events:auto;position:fixed;inset:0;background:#020b09dd;z-index:20;color:#62ff9b;font-family:Consolas,monospace}.hack.open{display:block}.binary{position:absolute;inset:0;overflow:hidden;opacity:.18;font-size:18px;line-height:1.4;word-break:break-all;color:#00ff88}.hackbox{position:relative;width:min(470px,90%);margin:8vh auto;background:#06140deF;border:1px solid #25ff78;box-shadow:0 0 35px #00ff7655;border-radius:12px;padding:22px}.hackbox h2{margin:0 0 5px;color:#8affb3}.hackbox p{color:#8cdba8}.hackbox label{display:block;margin:13px 0 5px}.hackbox input,.hackbox select{width:100%;padding:10px;background:#071b10;color:#baffcc;border:1px solid #2fae61;border-radius:6px;font:inherit}.hackbuttons{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.hackbuttons button{cursor:pointer;padding:10px 14px;background:#3cff88;border:0;border-radius:6px;font-weight:800}.hackbuttons .close{background:#193a28;color:#baffcc}.hackstatus{min-height:20px;color:#baffcc}.hacker-theme{filter:hue-rotate(70deg) saturate(1.35)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="top"><div class="card"><div class="title">⛏️ CLIMB & MINE</div><div>Low-poly bacon boy • no external files</div></div><div class="card stats"><span>🪙 <b id="coins">240</b></span><span>🏆 <b id="wins">6</b></span><span>🏔️ <b id="summit">6</b></span><span>⛏️ <b id="blocks">0</b></span></div></div><div class="cross"></div><div id="toast" class="toast"></div><div class="help card"><kbd>WASD</kbd> move &nbsp; <kbd>E</kbd> climb &nbsp; <kbd>F</kbd> kick &nbsp; <kbd>LMB</kbd> mine blocks<br><small>Click the canvas once to lock the mouse. Type <kbd>0000</kbd> for the developer panel.</small></div></div>
<div id="hack" class="hack"><div id="binary" class="binary"></div><div class="hackbox"><h2>⌘ DEVELOPER CONSOLE // 0000</h2><p>Local sandbox controls. Changes are saved only in this browser.</p><label>Coins / money</label><input id="hackCoins" type="number" min="0" step="1"><label>Avatar skin</label><select id="hackSkin"><option value="bacon">Bacon boy</option><option value="classic">Classic blue</option><option value="neon">Neon hacker</option><option value="gold">Golden</option></select><label>World color</label><input id="hackColor" type="color" value="#65bce8"><div class="hackbuttons"><button id="applyHack">APPLY CHANGES</button><button id="hackBackground">HACKER BACKGROUND</button><button id="closeHack" class="close">CLOSE [ESC]</button></div><div id="hackStatus" class="hackstatus"></div></div></div>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W,H,dpr;function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const save0={coins:240,wins:6,level:4,xp:263,speed:3,summit:6,distance:48,rebirths:0,pickaxe:true,magnet:true,skin:'bacon',worldColor:'#65bce8',hacker:false};let state={...save0,...JSON.parse(localStorage.getItem('climbMineSave')||'{}')};const keys={};let player={x:0,z:0,y:0,rot:0};let blocks=[];for(let x=-7;x<=7;x++)for(let z=-7;z<=7;z++){let h=1+Math.floor(Math.random()*3);if(Math.abs(x)<2&&Math.abs(z)<2)h=0;for(let y=0;y<h;y++)blocks.push({x,y,z,type:y===h-1?'grass':'stone',gone:false})}for(let i=0;i<20;i++)blocks.push({x:Math.floor(Math.random()*13)-6,y:3+Math.floor(Math.random()*3),z:Math.floor(Math.random()*13)-6,type:'ore',gone:false});
function save(){localStorage.setItem('climbMineSave',JSON.stringify(state));ui()}function ui(){for(const id of ['coins','wins','summit'])document.getElementById(id).textContent=state[id];document.getElementById('blocks').textContent=blocks.filter(b=>b.gone).length}function toast(t,bad=false){const e=document.getElementById('toast');e.textContent=t;e.className='toast show'+(bad?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.className='toast',900)}
function openHack(){document.getElementById('hack').classList.add('open');document.getElementById('hackCoins').value=state.coins;document.getElementById('hackSkin').value=state.skin||'bacon';document.getElementById('hackColor').value=state.worldColor||'#65bce8';document.getElementById('hackStatus').textContent='ACCESS GRANTED // 0000';if(document.pointerLockElement)document.exitPointerLock();}function closeHack(){document.getElementById('hack').classList.remove('open')}function binary(){let out='';for(let i=0;i<900;i++)out+=(Math.random()>.5?'1':'0')+(i%32===31?'\n':'');document.getElementById('binary').textContent=out}binary();setInterval(binary,700);let typed='';addEventListener('keydown',e=>{typed=(typed+e.key).slice(-4);if(typed==='0000')openHack();if(e.key==='Escape')closeHack()});document.getElementById('applyHack').onclick=()=>{let n=Number(document.getElementById('hackCoins').value);if(Number.isFinite(n)&&n>=0)state.coins=Math.floor(n);state.skin=document.getElementById('hackSkin').value;state.worldColor=document.getElementById('hackColor').value;state.hacker=document.getElementById('hackBackground').dataset.on==='1';save();document.getElementById('hackStatus').textContent='CHANGES APPLIED // SAVE COMPLETE'};document.getElementById('hackBackground').onclick=e=>{let on=e.currentTarget.dataset.on!=='1';e.currentTarget.dataset.on=on?'1':'0';state.hacker=on;document.body.classList.toggle('hacker-theme',on);e.currentTarget.textContent=on?'NORMAL BACKGROUND':'HACKER BACKGROUND';save();};document.getElementById('closeHack').onclick=closeHack;if(state.hacker){document.body.classList.add('hacker-theme');document.getElementById('hackBackground').dataset.on='1';document.getElementById('hackBackground').textContent='NORMAL BACKGROUND'}
function press(e){keys[e.key.toLowerCase()]=true;if(['w','a','s','d','e','f',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='e')climb();if(e.key.toLowerCase()==='f')kick()}function release(e){keys[e.key.toLowerCase()]=false}addEventListener('keyup',release);addEventListener('keydown',press);canvas.addEventListener('click',()=>{if(document.pointerLockElement!==canvas)canvas.requestPointerLock?.();mine()});addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas)player.rot+=e.movementX*.003});
function nearest(max=2.4){let best=null,dist=max;for(const b of blocks){if(b.gone)continue;let dx=b.x-player.x,dz=b.z-player.z,dd=Math.hypot(dx,dz);if(dd<dist&&b.y<=player.y+2){dist=dd;best=b}}return best}function mine(){let b=nearest(3);if(!b){toast('No block in reach',true);return}b.gone=true;let gain=b.type==='ore'?12:state.pickaxe?7:3;state.coins+=gain;state.xp+=2;toast('⛏️ Mined '+b.type+' +'+gain+' coins');save()}function kick(){let b=nearest(2.1);if(b){b.gone=true;state.coins++;toast('🦶 Kick! Block knocked out');save()}else toast('Nothing close enough to kick',true)}function climb(){let b=nearest(1.7);if(!b){toast('Move next to a block first',true);return}player.y=Math.min(7,player.y+1);state.distance=Math.min(100,state.distance+12);toast('🧗 Climbed up!');if(state.distance>=100){state.distance=0;state.summit++;state.wins++;state.coins+=state.magnet?30:20;toast('🏆 Summit reached!')}save()}
function move(dt){let v=(keys.shift?5:3+state.speed*.35)*dt,dx=0,dz=0;if(keys.w)dz-=v;if(keys.s)dz+=v;if(keys.a)dx-=v;if(keys.d)dx+=v;let c=Math.cos(player.rot),s=Math.sin(player.rot),nx=player.x+dx*c-dz*s,nz=player.z+dx*s+dz*c;if(Math.abs(nx)<7.4)player.x=nx;if(Math.abs(nz)<7.4)player.z=nz}function project(x,y,z){let c=Math.cos(player.rot),s=Math.sin(player.rot),dx=x-player.x,dz=z-player.z,X=dx*c-dz*s,Z=dx*s+dz*c+8,scale=430/Z;return{x:W/2+X*scale,y:H*.57-(y-player.y)*scale*.9,z:Z,scale}}function poly(points,fill){ctx.fillStyle=fill;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill()}
function cube(b){let p=project(b.x,b.y,b.z);if(p.z<1)return;let q=p.scale*.82,top=project(b.x,b.y+1,b.z),right=project(b.x+1,b.y,b.z),front=project(b.x,b.y,b.z+1),col=b.type==='grass'?'#65ad58':b.type==='ore'?'#b477d0':'#71869b';poly([{x:p.x,y:top.y},{x:right.x,y:right.y},{x:right.x,y:right.y-q*.12},{x:p.x,y:p.y-q*.12}],col);poly([{x:p.x,y:top.y},{x:front.x,y:front.y},{x:front.x,y:front.y-q*.12},{x:p.x,y:p.y-q*.12}],col==='stone'?'#556b82':col);poly([{x:p.x,y:p.y-q*.12},{x:right.x,y:right.y-q*.12},{x:right.x,y:right.y+q},{x:p.x,y:p.y+q},{x:front.x,y:front.y+q},{x:front.x,y:front.y-q*.12}],col);if(nearest(3)===b){ctx.strokeStyle='#ffe66d';ctx.lineWidth=3;ctx.strokeRect(p.x-q*.4,p.y-q*.15,q*.8,q*.8)}}
function bacon(){let p=project(player.x,player.y,player.z),sc=p.scale/90;ctx.save();ctx.translate(p.x,p.y-48*sc);ctx.scale(sc,sc);let skin=state.skin==='gold'?'#ffd166':state.skin==='neon'?'#70ffcf':'#f0a477',shirt=state.skin==='classic'?'#435ee8':state.skin==='neon'?'#b719d8':state.skin==='gold'?'#9d6615':'#267db0',hair=state.skin==='classic'?'#222':state.skin==='neon'?'#00ff88':state.skin==='gold'?'#fff1a8':'#a94332';ctx.fillStyle=shirt;ctx.fillRect(-18,10,36,32);ctx.fillStyle=skin;ctx.fillRect(-13,40,11,25);ctx.fillRect(2,40,11,25);ctx.fillRect(-16,-25,32,34);ctx.fillStyle=hair;ctx.beginPath();ctx.arc(-5,-28,13,0,Math.PI*2);ctx.arc(7,-25,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#19263b';ctx.fillRect(-9,-12,4,4);ctx.fillRect(6,-12,4,4);ctx.strokeStyle='#643b36';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-20,13);ctx.lineTo(-29,39);ctx.moveTo(20,13);ctx.lineTo(29,39);ctx.stroke();ctx.restore()}
let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;move(dt);ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H*.6);sky.addColorStop(0,state.worldColor||'#65bce8');sky.addColorStop(1,'#d7f0ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.6);ctx.fillStyle='#79b96a';ctx.fillRect(0,H*.6,W,H*.4);blocks.filter(b=>!b.gone).sort((a,b)=>project(b.x,b.y,b.z).z-project(a.x,a.y,a.z).z).forEach(cube);bacon();requestAnimationFrame(loop)}ui();requestAnimationFrame(loop);
</script></body></html>
